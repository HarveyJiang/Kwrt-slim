# nginx 反向代理：aria2 / OpenList 子域（用户 2026-10-24 方案 B 固件化）
# 配合 dnsmasq 把 aria2.local / openlist.local 解析到本机 LAN IP，
# 浏览器直接访问 http://aria2.local 或 http://openlist.local 即可。
# 说明：仅 http（未配证书）；LuCI 主站 server_name 不冲突（nginx 按 server_name 分流）。
# 修改此文件后：/etc/init.d/nginx reload 生效。

server {
	listen 80;
	server_name aria2.local;

	location / {
		proxy_pass http://127.0.0.1:6808;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}
}

server {
	listen 80;
	server_name openlist.local;

	location / {
		proxy_pass http://127.0.0.1:8899;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}
}
