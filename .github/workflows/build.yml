name: Build OpenWrt

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    name: Build qualcommax_ipq60xx

    steps:
    - name: Checkout
      uses: actions/checkout@main
      with:
          fetch-depth: 0

    - name: Load Settings.ini
      run: |
        source "${{ github.workspace }}/devices/common/settings.ini"
        if [ -f "devices/qualcommax_ipq60xx/settings.ini" ]; then
          source "${{ github.workspace }}/devices/qualcommax_ipq60xx/settings.ini"
        fi
        echo "REPO_URL=${REPO_URL}" >> $GITHUB_ENV
        echo "REPO_BRANCH=${REPO_BRANCH}" >> $GITHUB_ENV
        echo "CONFIG_FILE=${CONFIG_FILE}" >> $GITHUB_ENV
        echo "DIY_SH=${DIY_SH}" >> $GITHUB_ENV
        echo "UPLOAD_FIRMWARE_FOR_ARTIFACT=${UPLOAD_FIRMWARE_FOR_ARTIFACT}" >> $GITHUB_ENV

    - name: Free disk space
      uses: coder-xiaomo/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves \
        llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename \
        libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "Asia/Shanghai"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"

    - name: Get current date
      id: date
      run: |
        echo "date=$(date +'%m/%d_%Y_%H/%M')" >> $GITHUB_ENV
        echo "date2=$(date +'%m/%d %Y')" >> $GITHUB_ENV
        echo "VERSION=$(date +'%m.%d')" >> $GITHUB_ENV

    - name: Clone source code
      run: |
        set -x
        # openwrt 官方源 + GraphQL API 查询最新 v25 tag；API 限流时直接回落 openwrt-25.12
        REPO_BRANCH="openwrt-25.12"
        TAG_INFO="$(curl -gs -H 'Content-Type: application/json' \
           -X POST -d '{ "query": "query {repository(owner: \"openwrt\", name: \"openwrt\") {refs(refPrefix: \"refs/tags/\", first: 4, orderBy: {field: TAG_COMMIT_DATE, direction: DESC}) {nodes {name target { ... on Tag {tagger {date}}}}}}}"}' https://api.github.com/graphql || true)"
        TAG_DATE="$( echo ${TAG_INFO} | jq -r '.data.repository.refs.nodes[] | select(.name | startswith("v25")) | .target.tagger.date' 2>/dev/null | head -n 1 || true)"
        if [ -n "$TAG_DATE" ] && [[ $(( ($(date +%s) - $(date -d "$TAG_DATE" +%s)) / 86400 )) -lt 10 ]]; then
          REPO_BRANCH="$( echo ${TAG_INFO} | jq -r '.data.repository.refs.nodes[].name' | grep v25 | head -n 1)"
        fi
        echo "REPO_BRANCH=$REPO_BRANCH"
        git clone $REPO_URL -b $REPO_BRANCH openwrt

    - name: Free up disk space
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo mkdir -p -m 777 /mnt/openwrt/build_dir openwrt/staging_dir
        ln -sf /mnt/openwrt/build_dir openwrt/build_dir
        sudo ln -sf openwrt/staging_dir /mnt/openwrt/staging_dir

    - name: Load custom configuration
      run: |
        function git_clone_path() {
          trap 'rm -rf "$tmpdir"' EXIT
          branch="$1" rurl="$2" mv="$3"
          [[ "$mv" != "mv" ]] && shift 2 || shift 3
          rootdir="$PWD"
          tmpdir="$(mktemp -d)" || exit 1
          if [ ${#branch} -lt 10 ]; then
          git clone -b "$branch" --depth 1 --filter=blob:none --sparse "$rurl" "$tmpdir"
          cd "$tmpdir"
          else
          git clone --filter=blob:none --sparse "$rurl" "$tmpdir"
          cd "$tmpdir"
          git checkout $branch
          fi
          if [ "$?" != 0 ]; then
            echo "error on $rurl"
            exit 1
          fi
          git sparse-checkout init --cone
          git sparse-checkout set $@
          [[ "$mv" != "mv" ]] && cp -rn ./* $rootdir/ || mv -n $@/* $rootdir/$@/
          cd $rootdir
          }
        export -f git_clone_path
        mkdir -p openwrt
        cp -rf devices/common/. openwrt/
        cp -rf devices/qualcommax_ipq60xx/. openwrt/
        cp -rf devices openwrt/
        cd openwrt
        chmod +x devices/common/$DIY_SH
        /bin/bash "devices/common/$DIY_SH"
        cp -f devices/common/$CONFIG_FILE .config
        if [ -f "devices/qualcommax_ipq60xx/$CONFIG_FILE" ]; then
          echo >> .config
          cat devices/qualcommax_ipq60xx/$CONFIG_FILE >> .config
        fi
        if [ -f "devices/qualcommax_ipq60xx/$DIY_SH" ]; then
          chmod +x devices/qualcommax_ipq60xx/$DIY_SH
          echo "/bin/bash devices/qualcommax_ipq60xx/$DIY_SH"
          /bin/bash "devices/qualcommax_ipq60xx/$DIY_SH"
        fi
        cp -Rf ./diy/* ./ || true

    - name: Apply patches
      run: |
        cd openwrt
        cp -rn devices/common/patches devices/qualcommax_ipq60xx/
          if [ -n "$(ls -A devices/qualcommax_ipq60xx/*.bin.patch 2>/dev/null)" ]; then
            git apply devices/qualcommax_ipq60xx/patches/*.bin.patch
          fi
          find "devices/qualcommax_ipq60xx/patches" -maxdepth 1 -type f -name '*.revert.patch' -print0 | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' -R --no-backup-if-mismatch -p1 -F 1 -i '%'"
          find "devices/qualcommax_ipq60xx/patches" -maxdepth 1 -type f -name '*.patch' ! -name '*.revert.patch' ! -name '*.bin.patch' -print0 | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' --no-backup-if-mismatch -p1 -F 1 -i '%'"

    - name: Defconfig
      run: |
        cd openwrt
        make defconfig
        sed -n '/# Wireless Drivers/,/# end of Wireless Drivers/p' .config | sed -e 's/=m/=n/' >>.config
        sed -i "s/\(kmod-qca.*\)=m/\1=n/" .config
        make defconfig
        cat .config

    - name: Cache
      uses: stupidloud/cachewrtbuild@main
      with:
        ccache: 'false'
        mixkey: qualcommax_ipq60xx
        clean: ${{ contains(github.event.action, 'nocache') }}
        prefix: ${{ github.workspace }}/openwrt

    - name: Compile the firmware
      id: compile
      # 故意吞掉 make 的失败退出码：即使编译失败，本步骤也返回成功，
      # 这样 Cache action 的 post-if: success() 才能执行并保存缓存，
      # 下次触发就能续上已编译的 tools/toolchain，而不是从零重来。
      # 真正的判定放在下一步 Verify build output。
      continue-on-error: true
      run: |
        shopt -s extglob
        df -hT
        cd openwrt
        echo -e "$(($(nproc)+1)) thread compile"
        # 注意：不能写 `make ... || { ...; }` 再取 $?，因为 $? 会变成花括号块的退出码。
        # 这里显式记录 make 的返回码，失败时再用 V=s 单线程复跑一段取详细日志。
        make_rc=0
        make -j$(($(nproc)+1)) || make_rc=$?
        if [ "$make_rc" != 0 ]; then
          echo "::warning::并行编译失败（rc=$make_rc），改用 V=s 单线程复跑以获取详细报错"
          log=$(mktemp)
          make V=s &>$log || true
          # 只 tail 末尾几十行会漏掉前面包安装阶段的错误（apk 一次能报 6 个错，
          # 末尾往往只有最后 2 个），所以先把所有关键错误行整段打出来。
          echo "===== 关键错误行（apk 覆盖冲突 / 缺依赖 / 编译失败） ====="
          grep -nE "ERROR:|error:|failed to build|Error [0-9]+|unable to select|trying to overwrite|overwriting .* owned by|No such file" $log | tail -200 || true
          echo "===== 详细日志最后 200 行 ====="
          tail -200 $log
          echo "===== 日志结束 ====="
          # 完整日志另存为 artifact，避免 GitHub 日志截断后看不到前面的错误
          cp "$log" build-failure.log || true
          ls -lh build-failure.log || true
        fi
        echo "MAKE_RC=$make_rc" >> $GITHUB_ENV
        rm -rf staging_dir/toolchain-*/bin/*openwrt-linux-musl-lto-dump
        rm -rf staging_dir/toolchain-*/initial
        df -hT
        echo "make 退出码: $make_rc（0 为成功；非 0 时由 Verify build output 步骤判定失败）"
        exit 0

    - name: Verify build output
      id: verify
      # 上一步吞掉了失败码，这里做真正的判定：产物不存在就让 job 失败。
      # 顺序上必须排在 Cache(Post) 之前执行完毕，缓存才会被保存。
      run: |
        shopt -s extglob
        cd openwrt
        ls -lh bin/targets/*/*/ || true
        ok=1
        [ "${MAKE_RC:-0}" = "0" ] || { echo "::error::make 以非 0 退出（MAKE_RC=$MAKE_RC）"; ok=0; }
        if compgen -G "bin/targets/*/*/*sysupgrade.bin" >/dev/null; then
          echo "构建成功：找到 sysupgrade.bin"
        else
          echo "::error::构建失败：未在 bin/targets 下找到 sysupgrade.bin（make 退出码 ${MAKE_RC:-?}）"
          ok=0
        fi
        if [ "$ok" = 1 ]; then
          echo "BUILD_OK=true" >> $GITHUB_ENV
        else
          echo "BUILD_OK=false" >> $GITHUB_ENV
          exit 1
        fi

    - name: Organize files
      id: organize
      if: env.BUILD_OK == 'true'
      continue-on-error: true
      run: |
        shopt -s extglob
        cd openwrt/bin/targets/*/*/
        cp $GITHUB_WORKSPACE/openwrt/.config qualcommax_ipq60xx.config || true
        cp $GITHUB_WORKSPACE/openwrt/build_dir/target-*/linux-*/linux-*/.config qualcommax_ipq60xx_kernel.config || true

    - name: Upload firmware for artifact
      uses: actions/upload-artifact@main
      if: env.UPLOAD_FIRMWARE_FOR_ARTIFACT == 'true' && env.BUILD_OK == 'true'
      with:
        name: ${{ env.VERSION }}_qualcommax_ipq60xx
        path: |
          openwrt/bin/targets/

    - name: Upload build log on failure
      uses: actions/upload-artifact@main
      if: failure()
      with:
        name: build-log
        path: openwrt/build-failure.log
        if-no-files-found: ignore
        retention-days: 7

    - name: Delete workflow runs
      uses: GitRML/delete-workflow-runs@main
      continue-on-error: true
      with:
        token: ${{ github.token }}
        retain_days: 30
        keep_minimum_runs: 1
