name: Build OpenWrt

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  # 编译参数：默认单线程 + 详细输出。
  # 并行 make 失败时只会给出 "ERROR: target/linux failed to build" 这类笼统错误，
  # 真实报错（编译器的 error:、OOM、缺文件…）被其它包的输出淹没，只能靠失败后
  # 再复跑一遍 V=s 去捞，代价是整个编译跑两遍。
  # 改成默认单线程后，出错日志里能直接看到错误行。
  # 需要恢复并行时，把 MAKE_JOBS 改成 4 即可（MAKE_VERBOSE 可改成 V=sc 减小日志量）。
  MAKE_JOBS: 1
  MAKE_VERBOSE: V=s

jobs:
  build:
    runs-on: ubuntu-latest

    # GitHub 托管 runner 的默认 job 上限是 6 小时（360 分钟），单线程 MAKE_JOBS=1
    # 的一次全量编译（工具链 3h+ + 内核 1h+ + packages 2h+ + 镜像）明显超过 6 小时，
    # 会被硬砍成 failure/cancelled，而且被砍时「失败也存工具链缓存」那一步来不及执行，
    # 下一次又得从零编译工具链。这里放宽到 12 小时。
    timeout-minutes: 720

    name: Build qualcommax_ipq60xx

    steps:
    - name: Checkout
      uses: actions/checkout@main
      with:
          fetch-depth: 0

    - name: Load Settings.ini
      run: |
        source "${{ github.workspace }}/devices/common/settings.ini"
        if [ -f "devices/qualcommax_ipq60xx/settings.ini" ]; then
          source "${{ github.workspace }}/devices/qualcommax_ipq60xx/settings.ini"
        fi
        echo "REPO_URL=${REPO_URL}" >> $GITHUB_ENV
        echo "REPO_BRANCH=${REPO_BRANCH}" >> $GITHUB_ENV
        echo "CONFIG_FILE=${CONFIG_FILE}" >> $GITHUB_ENV
        echo "DIY_SH=${DIY_SH}" >> $GITHUB_ENV
        echo "UPLOAD_FIRMWARE_FOR_ARTIFACT=${UPLOAD_FIRMWARE_FOR_ARTIFACT}" >> $GITHUB_ENV

    - name: Free disk space
      uses: coder-xiaomo/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves \
        llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename \
        libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "Asia/Shanghai"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"

    - name: Get current date
      id: date
      run: |
        echo "date=$(date +'%m/%d_%Y_%H/%M')" >> $GITHUB_ENV
        echo "date2=$(date +'%m/%d %Y')" >> $GITHUB_ENV
        echo "VERSION=$(date +'%m.%d')" >> $GITHUB_ENV

    - name: Clone source code
      run: |
        set -x
        # openwrt 官方源 + GraphQL API 查询最新 v25 tag；API 限流时直接回落 openwrt-25.12
        REPO_BRANCH="openwrt-25.12"
        TAG_INFO="$(curl -gs -H 'Content-Type: application/json' \
           -X POST -d '{ "query": "query {repository(owner: \"openwrt\", name: \"openwrt\") {refs(refPrefix: \"refs/tags/\", first: 4, orderBy: {field: TAG_COMMIT_DATE, direction: DESC}) {nodes {name target { ... on Tag {tagger {date}}}}}}}"}' https://api.github.com/graphql || true)"
        TAG_DATE="$( echo ${TAG_INFO} | jq -r '.data.repository.refs.nodes[] | select(.name | startswith("v25")) | .target.tagger.date' 2>/dev/null | head -n 1 || true)"
        if [ -n "$TAG_DATE" ] && [[ $(( ($(date +%s) - $(date -d "$TAG_DATE" +%s)) / 86400 )) -lt 10 ]]; then
          REPO_BRANCH="$( echo ${TAG_INFO} | jq -r '.data.repository.refs.nodes[].name' | grep v25 | head -n 1)"
        fi
        echo "REPO_BRANCH=$REPO_BRANCH"
        git clone $REPO_URL -b $REPO_BRANCH openwrt

    - name: Free up disk space
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo mkdir -p -m 777 /mnt/openwrt/build_dir openwrt/staging_dir
        ln -sf /mnt/openwrt/build_dir openwrt/build_dir
        sudo ln -sf openwrt/staging_dir /mnt/openwrt/staging_dir

    - name: Load custom configuration
      run: |
        function git_clone_path() {
          trap 'rm -rf "$tmpdir"' EXIT
          branch="$1" rurl="$2" mv="$3"
          [[ "$mv" != "mv" ]] && shift 2 || shift 3
          rootdir="$PWD"
          tmpdir="$(mktemp -d)" || exit 1
          if [ ${#branch} -lt 10 ]; then
          git clone -b "$branch" --depth 1 --filter=blob:none --sparse "$rurl" "$tmpdir"
          cd "$tmpdir"
          else
          git clone --filter=blob:none --sparse "$rurl" "$tmpdir"
          cd "$tmpdir"
          git checkout $branch
          fi
          if [ "$?" != 0 ]; then
            echo "error on $rurl"
            exit 1
          fi
          git sparse-checkout init --cone
          git sparse-checkout set $@
          [[ "$mv" != "mv" ]] && cp -rn ./* $rootdir/ || mv -n $@/* $rootdir/$@/
          cd $rootdir
          }
        export -f git_clone_path
        mkdir -p openwrt
        cp -rf devices/common/. openwrt/
        cp -rf devices/qualcommax_ipq60xx/. openwrt/
        cp -rf devices openwrt/
        cd openwrt
        chmod +x devices/common/$DIY_SH
        /bin/bash "devices/common/$DIY_SH"
        cp -f devices/common/$CONFIG_FILE .config
        if [ -f "devices/qualcommax_ipq60xx/$CONFIG_FILE" ]; then
          echo >> .config
          cat devices/qualcommax_ipq60xx/$CONFIG_FILE >> .config
        fi
        if [ -f "devices/qualcommax_ipq60xx/$DIY_SH" ]; then
          chmod +x devices/qualcommax_ipq60xx/$DIY_SH
          echo "/bin/bash devices/qualcommax_ipq60xx/$DIY_SH"
          /bin/bash "devices/qualcommax_ipq60xx/$DIY_SH"
        fi
        cp -Rf ./diy/* ./ || true

    - name: Apply patches
      run: |
        cd openwrt
        cp -rn devices/common/patches devices/qualcommax_ipq60xx/
          if [ -n "$(ls -A devices/qualcommax_ipq60xx/*.bin.patch 2>/dev/null)" ]; then
            git apply devices/qualcommax_ipq60xx/patches/*.bin.patch
          fi
          find "devices/qualcommax_ipq60xx/patches" -maxdepth 1 -type f -name '*.revert.patch' -print0 | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' -R --no-backup-if-mismatch -p1 -F 1 -i '%'"
          find "devices/qualcommax_ipq60xx/patches" -maxdepth 1 -type f -name '*.patch' ! -name '*.revert.patch' ! -name '*.bin.patch' -print0 | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' --no-backup-if-mismatch -p1 -F 1 -i '%'"

    - name: Defconfig
      run: |
        cd openwrt
        make defconfig
        sed -n '/# Wireless Drivers/,/# end of Wireless Drivers/p' .config | sed -e 's/=m/=n/' >>.config
        sed -i "s/\(kmod-qca.*\)=m/\1=n/" .config
        make defconfig
        cat .config

    # ---- 工具链缓存 ----
    # actions/cache 用「path 字符串」算 version 哈希：
    #   version = sha256("<path1>|<path2>|<压缩方式>|1.0")
    # 压缩方式在 ubuntu runner 上是 zstd-without-long。
    # 恢复侧和保存侧的 path 必须逐字一致，否则 version 不同 → 互相看不见，
    # 缓存永远命不中（之前用 cachewrtbuild 恢复时是 "staging_dir/host*"，
    # 保存时写的是 "openwrt/staging_dir/host*"，两者哈希不同，一直 miss）。
    # 现在两侧统一用相对 workspace 的 "openwrt/staging_dir/*"，glob 也能找到。
    #
    # 缓存 key = "<mixkey>-cache-openwrt-<toolchainHash>"，
    # toolchainHash = openwrt 仓库里最近一次改动 tools/ 或 toolchain/ 的
    # 提交短 hash（跟我们的 diy 提交无关，所以换 commit 也能命中）。
    - name: Compute toolchain cache key
      id: toolchain_key
      continue-on-error: true
      run: |
        cd openwrt
        hash=$(git log --pretty=tformat:"%h" -n1 -- tools toolchain 2>/dev/null || true)
        echo "hash=qualcommax_ipq60xx-cache-openwrt-${hash}" >> $GITHUB_OUTPUT
        echo "toolchain cache key: qualcommax_ipq60xx-cache-openwrt-${hash}"

    - name: Restore toolchain cache
      id: restore_toolchain
      continue-on-error: true
      uses: actions/cache/restore@v4
      with:
        path: |
          openwrt/staging_dir/host*
          openwrt/staging_dir/tool*
        key: ${{ steps.toolchain_key.outputs.hash }}

    # 命中缓存时把 Makefile 里对 tools/toolchain 的 stamp 依赖摘掉，
    # 否则 make 认为工具链没编过，从头再编一遍（单线程要 2~3 小时）。
    # 这两条 sed 与 cachewrtbuild 的做法一致。
    - name: Skip toolchain rebuild
      if: steps.restore_toolchain.outputs.cache-hit == 'true'
      continue-on-error: true
      run: |
        cd openwrt
        sed -i 's/ $(tool.*\/stamp-compile)//;' Makefile
        sed -i 's/ $(tool.*\/stamp-install);//;' Makefile
        echo "Toolchain building skipped"

    - name: Compile the firmware
      id: compile
      # 默认单线程 + 详细输出（MAKE_JOBS=1, MAKE_VERBOSE=V=s，见文件顶部 env）：
      # 并行 make 失败时 make 只报 "target/linux failed to build"，真实报错被其它
      # 包的输出盖住；单线程虽然慢，但日志里能直接看到出错的那一行。
      # 故意吞掉 make 的失败退出码：即使编译失败，本步骤也返回成功，
      # 这样 Cache action 的 post-if: success() 才能执行并保存缓存，
      # 下次触发就能续上已编译的 tools/toolchain，而不是从零重来。
      # 真正的判定放在下一步 Verify build output。
      continue-on-error: true
      run: |
        shopt -s extglob
        df -hT
        cd openwrt
        log=build.log
        echo "编译模式: make -j${MAKE_JOBS} ${MAKE_VERBOSE}（单线程详细输出，错误直接可见）"
        echo "开始时间: $(date '+%F %T')  nproc=$(nproc)"
        # 用 tee 一边输出到控制台一边落盘；make 的退出码从 PIPESTATUS[0] 取，
        # 不用 `|| { ...; }` 再取 $?（那样 $? 会变成花括号块的退出码）。
        # 先 set +e：即便 shell 带 pipefail，make 失败也不会让脚本提前退出。
        set +e
        make -j${MAKE_JOBS} ${MAKE_VERBOSE} 2>&1 | tee "$log"
        make_rc=${PIPESTATUS[0]}
        set -e
        echo "make 退出码: $make_rc（0 为成功；非 0 时由 Verify build output 步骤判定失败）"
        echo "MAKE_RC=$make_rc" >> $GITHUB_ENV
        if [ "$make_rc" != 0 ]; then
          # 控制台日志可能被 GitHub 截断，这里把关键错误行整段再打一遍，
          # 并把「错误行 + 末尾日志」存成 artifact，便于失败后离线分析。
          echo "===== 关键错误行（编译失败 / apk 冲突 / 缺依赖 / OOM） ====="
          grep -nE "ERROR:|error:|failed to build|Error [0-9]+|unable to select|trying to overwrite|overwriting .* owned by|No such file|out of memory|Out of memory|Killed|Segmentation fault|cannot find|No such directory" "$log" | tail -300 || true
          echo "===== 日志最后 300 行 ====="
          tail -300 "$log" || true
          echo "===== 日志结束 ====="
          {
            echo "===== 关键错误行 ====="
            grep -nE "ERROR:|error:|failed to build|Error [0-9]+|unable to select|trying to overwrite|overwriting .* owned by|No such file|out of memory|Out of memory|Killed|Segmentation fault|cannot find|No such directory" "$log" | tail -500 || true
            echo "===== 日志最后 500 行 ====="
            tail -500 "$log" || true
          } > build-failure.log || true
          ls -lh build-failure.log "$log" || true
          # 完整日志压缩后也留一份，避免 build.log 太大撑爆 runner 磁盘
          gzip -9 -f "$log" || true
          ls -lh "$log.gz" 2>/dev/null || true
        fi
        rm -rf staging_dir/toolchain-*/bin/*openwrt-linux-musl-lto-dump
        rm -rf staging_dir/toolchain-*/initial
        df -hT
        exit 0

    - name: Verify build output
      id: verify
      # 判定以「固件产物是否齐全」为准，而不是 make 的退出码。
      # 原因：make 的 world 目标末尾还有若干收尾步骤（复制索引文件、清理 staging 等），
      # 它们失败时固件本身早已可用，却会把整轮数小时的编译判成 red，而且产物不会被
      # 上传成 artifact（等于白跑）。只有真的没产出 sysupgrade.bin 才算构建失败。
      # 顺序上必须排在 Cache(Post) 之前执行完毕，缓存才会被保存。
      run: |
        shopt -s extglob
        cd openwrt
        ls -lh bin/targets/*/*/ || true
        ok=0
        if compgen -G "bin/targets/*/*/*sysupgrade.bin" >/dev/null; then
          echo "构建成功：找到 sysupgrade.bin"
          ok=1
          if [ "${MAKE_RC:-0}" != "0" ]; then
            echo "::warning::make 以非 0 退出（MAKE_RC=$MAKE_RC），但 sysupgrade.bin 已产出，按成功处理；失败详情见 build-log artifact"
          fi
        else
          echo "::error::构建失败：未在 bin/targets 下找到 sysupgrade.bin（make 退出码 ${MAKE_RC:-?}）"
        fi
        # 固件体积报告：AX1800 Pro 的 U-Boot 刷入上限是 60MB，超了 U-Boot 直刷会失败。
        # 这里只打印实际体积并给出警告，不判失败 —— 按用户口径「超过就操过，只要有输出产物」，
        # 体积不作为构建的硬门禁（sysupgrade 直写 MTD 不走 U-Boot）。
        # 体积账本与瘦身方法见 devices/common/.config 的「固件体积账本」注释。
        size_limit=$((60*1024*1024))
        for f in bin/targets/*/*/*factory.bin; do
          [ -f "$f" ] || continue
          fsz=$(stat -c %s "$f")
          echo "固件体积: $f = ${fsz} 字节（$(( fsz / 1024 / 1024 )) MB，上限 $(( size_limit / 1024 / 1024 )) MB）"
          if [ "$fsz" -ge "$size_limit" ]; then
            echo "::warning::固件超过 U-Boot 刷入上限 60MB：$f（$(( fsz / 1024 / 1024 )) MB），U-Boot 直刷会失败，需走 sysupgrade 或按 .config 里的体积账本瘦身"
          fi
        done
        if [ "$ok" = 1 ]; then
          echo "BUILD_OK=true" >> $GITHUB_ENV
        else
          echo "BUILD_OK=false" >> $GITHUB_ENV
          exit 1
        fi

    - name: Organize files
      id: organize
      if: env.BUILD_OK == 'true'
      continue-on-error: true
      run: |
        shopt -s extglob
        cd openwrt/bin/targets/*/*/
        cp $GITHUB_WORKSPACE/openwrt/.config qualcommax_ipq60xx.config || true
        cp $GITHUB_WORKSPACE/openwrt/build_dir/target-*/linux-*/linux-*/.config qualcommax_ipq60xx_kernel.config || true

    # ---- 产物按用途分组 ----
    # 以前是把整个 bin/targets/ 打成 1 个 artifact（1.2GB+：
    # imagebuilder 445MB + 三个各 126MB 的镜像 + 全部 apk 包），下载一次太重，
    # 而且用的人只想拿其中一两个文件。
    # 这里先按用途分目录，再每个目录单独上传成一个 artifact，
    # 页面上就能「需要哪个下哪个」：
    #   <ver>-firmware-sysupgrade  刷机主力（sysupgrade.bin + 校验和/manifest/config）
    #   <ver>-firmware-factory    U-Boot 直刷用 factory.bin
    #   <ver>-firmware-initramfs  initramfs 应急启动
    #   <ver>-imagebuilder        改包自己重编译用的 imagebuilder
    #   <ver>-packages            用户态 apk 包集合
    #   <ver>-kernel-packages     kmod 内核模块包集合
    #   <ver>-metadata            索引/元信息小文件
    - name: Split artifacts into groups
      if: env.UPLOAD_FIRMWARE_FOR_ARTIFACT == 'true' && env.BUILD_OK == 'true'
      continue-on-error: true
      run: |
        chmod +x .github/scripts/split-artifacts.sh
        .github/scripts/split-artifacts.sh openwrt/bin/targets "$GITHUB_WORKSPACE/artifacts"

    - name: Upload firmware-sysupgrade
      uses: actions/upload-artifact@main
      if: env.UPLOAD_FIRMWARE_FOR_ARTIFACT == 'true' && env.BUILD_OK == 'true'
      with:
        name: ${{ env.VERSION }}-firmware-sysupgrade
        path: artifacts/firmware-sysupgrade/
        if-no-files-found: ignore

    - name: Upload firmware-factory
      uses: actions/upload-artifact@main
      if: env.UPLOAD_FIRMWARE_FOR_ARTIFACT == 'true' && env.BUILD_OK == 'true'
      with:
        name: ${{ env.VERSION }}-firmware-factory
        path: artifacts/firmware-factory/
        if-no-files-found: ignore

    - name: Upload firmware-initramfs
      uses: actions/upload-artifact@main
      if: env.UPLOAD_FIRMWARE_FOR_ARTIFACT == 'true' && env.BUILD_OK == 'true'
      with:
        name: ${{ env.VERSION }}-firmware-initramfs
        path: artifacts/firmware-initramfs/
        if-no-files-found: ignore

    - name: Upload imagebuilder
      uses: actions/upload-artifact@main
      if: env.UPLOAD_FIRMWARE_FOR_ARTIFACT == 'true' && env.BUILD_OK == 'true'
      with:
        name: ${{ env.VERSION }}-imagebuilder
        path: artifacts/imagebuilder/
        if-no-files-found: ignore

    - name: Upload packages
      uses: actions/upload-artifact@main
      if: env.UPLOAD_FIRMWARE_FOR_ARTIFACT == 'true' && env.BUILD_OK == 'true'
      with:
        name: ${{ env.VERSION }}-packages
        path: artifacts/packages/
        if-no-files-found: ignore

    - name: Upload metadata
      uses: actions/upload-artifact@main
      if: env.UPLOAD_FIRMWARE_FOR_ARTIFACT == 'true' && env.BUILD_OK == 'true'
      with:
        name: ${{ env.VERSION }}-metadata
        path: artifacts/metadata/
        if-no-files-found: ignore

    - name: Upload build log on failure
      uses: actions/upload-artifact@main
      if: failure()
      with:
        name: build-log
        path: |
          openwrt/build-failure.log
          openwrt/build.log.gz
        if-no-files-found: ignore
        retention-days: 7

    - name: Upload build log when make exited non-zero
      uses: actions/upload-artifact@main
      # make 非 0 退出但产物齐全时 job 仍算成功，这里单独把失败日志留成 artifact，
      # 免得「绿色的 run」反而丢掉了排查线索。
      if: always() && env.BUILD_OK == 'true' && env.MAKE_RC != '' && env.MAKE_RC != '0'
      with:
        name: build-log
        path: |
          openwrt/build-failure.log
          openwrt/build.log.gz
        if-no-files-found: ignore
        retention-days: 7

    - name: Delete workflow runs
      uses: GitRML/delete-workflow-runs@main
      continue-on-error: true
      with:
        token: ${{ github.token }}
        retain_days: 30
        keep_minimum_runs: 1

    # 工具链缓存保存：编译失败时也要存下来，否则每次修一个错都要从零编译 3 小时
    # （toolchain 占大头）。path 必须和上面 Restore 步骤逐字一致，
    # 否则 version 哈希对不上，两边互相看不见。
    # 命中过缓存就不用再存（key+version 已存在，actions/cache 会拒绝覆盖）；
    # 工具链没编出来时也不能存，否则半成品缓存会污染后续构建。
    - name: Check toolchain is built
      id: toolchain_state
      if: always()
      continue-on-error: true
      run: |
        if ls openwrt/staging_dir/toolchain-*/bin/*-gcc >/dev/null 2>&1; then
          echo "ready=true" >> $GITHUB_OUTPUT
          echo "toolchain built, cache can be saved"
        else
          echo "ready=false" >> $GITHUB_OUTPUT
          echo "toolchain NOT built, skip saving cache"
        fi

    - name: Save toolchain cache
      if: always() && steps.toolchain_state.outputs.ready == 'true' && steps.restore_toolchain.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: |
          openwrt/staging_dir/host*
          openwrt/staging_dir/tool*
        key: ${{ steps.toolchain_key.outputs.hash }}
